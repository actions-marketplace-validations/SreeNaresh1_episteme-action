name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Single URL Verification
        uses: ./
        with:
          url: 'https://docs.python.org/3/tutorial/'
          fail-on-paywall: true

      - name: Test Batch URL Verification
        uses: ./
        with:
          urls: |
            https://developer.mozilla.org/en-US/
            https://cs50.harvard.edu/x/
          fail-on-paywall: true
